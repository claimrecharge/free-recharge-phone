<!DOCTYPE html><html>
<head>
<title>Result Page</title><style>
body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #090979, #4424a8, #00c6ff);
    font-family: Arial;
}

.emoji {
    font-size: 100px;
    animation: laugh 0.6s infinite alternate;
}

h1 {
    color: white;
    text-align: center;
    font-size: 30px;
}

@keyframes laugh {
    from {
        transform: rotate(-15deg) scale(1);
    }
    to {
        transform: rotate(15deg) scale(1.2);
    }
}
</style></head><body><div class="emoji">😂</div><h1>പോയി ഊമ്പ് ഡാ മൈരേ</h1></body>
</html>
